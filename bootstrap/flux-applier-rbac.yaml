apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: capz-aster
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-applier
  namespace: capz-aster
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier
  namespace: capz-aster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-applier
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: capz-aster
