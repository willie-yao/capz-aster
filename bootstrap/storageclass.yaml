apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: capz-aster-rwx
  labels:
    app.kubernetes.io/managed-by: aster
    app.kubernetes.io/part-of: aster
provisioner: file.csi.azure.com
parameters:
  protocol: nfs
  skuName: Premium_LRS
  allowSharedKeyAccess: "false"
  storeAccountKey: "false"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nconnect=4
  - noresvport
  - actimeo=30
