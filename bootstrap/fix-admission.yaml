apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: capz-aster
    meta.helm.sh/release-namespace: capz-aster
  labels:
    helm.sh/chart: aster-0.9.0-rc.1
    app.kubernetes.io/name: prow-ai-dashboard
    app.kubernetes.io/instance: capz-aster
    app.kubernetes.io/version: "v0.9.0-rc.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: agent-sandbox-fix-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
        scope: Namespaced
  matchConditions:
    - name: execution-namespace
      expression: "object.metadata.namespace == \"capz-aster-sandbox\""
    - name: dashboard-created-sandbox
      expression: "request.operation == 'CREATE' ? request.userInfo.username == \"system:serviceaccount:capz-aster:capz-aster-prow-ai-dashboard-agent-sandbox-client\" : (has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && 'prow-ai-dashboard/execution' in oldObject.metadata.labels)"
  variables:
    - name: pod
