    - name: container
      expression: "object.spec.podTemplate.spec.containers[0]"
  validations:
    - expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec"
      message: "dashboard Fix Sandboxes have an immutable workload spec"
    - expression: "request.operation != 'UPDATE' || object.metadata.labels == oldObject.metadata.labels"
      message: "dashboard Fix Sandbox labels are immutable"
    - expression: "request.operation != 'UPDATE' || (has(object.metadata.annotations) && has(oldObject.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] && object.metadata.annotations['prow-ai-dashboard/execution-id'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-id'])"
      message: "dashboard Fix Sandbox execution identity annotations are immutable"
    - expression: "request.operation != 'CREATE' || (object.metadata.name.matches('^fix-[a-z0-9-]+-[0-9a-f]{12}$') && has(object.metadata.labels) && size(object.metadata.labels) == 3 && object.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.metadata.labels['agents.x-k8s.io/created-by'] == 'prow-ai-dashboard' && object.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && (!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0))"
      message: "dashboard Fix Sandboxes must use the exact content-addressed labels and name without caller finalizers"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.annotations) && size(object.metadata.annotations) == 3 && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'].matches('^[0-9a-f]{64}$') && size(object.metadata.annotations['prow-ai-dashboard/execution-id']) > 0)"
      message: "dashboard Fix Sandboxes must carry the exact execution annotations"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'] == \"high\")"
      message: "dashboard Fix Sandboxes must use the configured reasoning effort"
    - expression: "request.operation != 'UPDATE' || object.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'] == oldObject.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort']"
      message: "dashboard Fix Sandbox reasoning effort is immutable"
    - expression: "request.operation != 'CREATE' || !has(object.metadata.annotations) || !('prow-ai-dashboard/model-provider-ca-sha256' in object.metadata.annotations)"
      message: "dashboard Fix Sandboxes must not add a public CA bundle annotation"
    - expression: "request.operation != 'UPDATE' || ((has(object.metadata.annotations) && 'prow-ai-dashboard/model-provider-ca-sha256' in object.metadata.annotations) == (has(oldObject.metadata.annotations) && 'prow-ai-dashboard/model-provider-ca-sha256' in oldObject.metadata.annotations) && (!has(object.metadata.annotations) || !('prow-ai-dashboard/model-provider-ca-sha256' in object.metadata.annotations) || (has(oldObject.metadata.annotations) && 'prow-ai-dashboard/model-provider-ca-sha256' in oldObject.metadata.annotations && object.metadata.annotations['prow-ai-dashboard/model-provider-ca-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/model-provider-ca-sha256'])))"
      message: "dashboard Fix Sandbox public CA bundle annotations cannot be introduced"
    # AdmissionRequest exposes no trusted wall-clock value. The adapter sets the
    # absolute shutdown time; admission pins Delete policy and the Pod deadline.
    - expression: "has(object.spec.shutdownTime) && has(object.spec.shutdownPolicy) && object.spec.shutdownPolicy == 'Delete' && (!has(object.spec.operatingMode) || object.spec.operatingMode == 'Running')"
      message: "dashboard Fix Sandboxes must declare shutdownTime and Delete policy"
    - expression: "has(object.spec.service) && object.spec.service == false && (!has(object.spec.volumeClaimTemplates) || size(object.spec.volumeClaimTemplates) == 0)"
      message: "dashboard Fix Sandboxes must not create Services or PVCs"
    - expression: "has(object.spec.podTemplate.metadata) && has(object.spec.podTemplate.metadata.labels) && size(object.spec.podTemplate.metadata.labels) == 1 && object.spec.podTemplate.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && (!has(object.spec.podTemplate.metadata.annotations) || size(object.spec.podTemplate.metadata.annotations) == 0)"
      message: "dashboard Fix Sandbox Pod metadata is fixed"
    - expression: "variables.pod.serviceAccountName == \"fix-workload\" && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == '') && has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false && variables.pod.runtimeClassName == \"aster-kata-vm-isolation\""
      message: "dashboard Fix Sandbox identity and RuntimeClass must match configured values"
    - expression: "variables.pod.restartPolicy == 'Never' && variables.pod.activeDeadlineSeconds == 615 && variables.pod.terminationGracePeriodSeconds == 5 && has(variables.pod.enableServiceLinks) && variables.pod.enableServiceLinks == false"
      message: "dashboard Fix Sandbox Pod lifecycle must match configured bounds"
    - expression: "(!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) && (!has(variables.pod.hostPID) || variables.pod.hostPID == false) && (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) && (!has(variables.pod.shareProcessNamespace) || variables.pod.shareProcessNamespace == false) && !has(variables.pod.hostUsers) && (!has(variables.pod.hostAliases) || size(variables.pod.hostAliases) == 0) && !has(variables.pod.dnsPolicy) && !has(variables.pod.dnsConfig) && !has(variables.pod.setHostnameAsFQDN)"
      message: "dashboard Fix Sandboxes must not join host namespaces or override DNS"
    - expression: "has(variables.pod.securityContext) && variables.pod.securityContext.runAsNonRoot == true && variables.pod.securityContext.runAsUser == 65532 && variables.pod.securityContext.runAsGroup == 65532 && variables.pod.securityContext.fsGroup == 65532 && variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.pod.securityContext.appArmorProfile.type == 'RuntimeDefault' && (!has(variables.pod.securityContext.sysctls) || size(variables.pod.securityContext.sysctls) == 0) && (!has(variables.pod.securityContext.supplementalGroups) || size(variables.pod.securityContext.supplementalGroups) == 0) && !has(variables.pod.securityContext.supplementalGroupsPolicy) && !has(variables.pod.securityContext.fsGroupChangePolicy) && !has(variables.pod.securityContext.seLinuxChangePolicy) && !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions)"
      message: "dashboard Fix Sandbox Pod security context is fixed"
    - expression: "size(variables.pod.containers) == 1 && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) && (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)"
      message: "dashboard Fix Sandboxes must contain exactly one executor container"
    - expression: "variables.container.name == 'executor' && variables.container.image == \"ghcr.io/willie-yao/aster/agent-sandbox-fix-executor@sha256:79be973ab5e541118290007241315446301cf586a29a576114ef338b31f649f0\" && variables.container.imagePullPolicy == \"IfNotPresent\" && (!has(variables.container.command) || size(variables.container.command) == 0) && (!has(variables.container.args) || size(variables.container.args) == 0)"
      message: "dashboard Fix Sandboxes must use the configured immutable executor entrypoint"
    - expression: "has(variables.container.securityContext) && variables.container.securityContext.runAsNonRoot == true && variables.container.securityContext.runAsUser == 65532 && variables.container.securityContext.runAsGroup == 65532 && variables.container.securityContext.allowPrivilegeEscalation == false && variables.container.securityContext.readOnlyRootFilesystem == true && variables.container.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.container.securityContext.appArmorProfile.type == 'RuntimeDefault' && has(variables.container.securityContext.capabilities) && size(variables.container.securityContext.capabilities.drop) == 1 && variables.container.securityContext.capabilities.drop[0] == 'ALL' && (!has(variables.container.securityContext.capabilities.add) || size(variables.container.securityContext.capabilities.add) == 0) && (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) && (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') && !has(variables.container.securityContext.seLinuxOptions) && !has(variables.container.securityContext.windowsOptions)"
      message: "dashboard Fix Sandbox container security context is fixed"
    - expression: "size(variables.container.env) == 2 && variables.container.env[0].name == 'PROW_AI_FIX_EXECUTION_REQUEST_B64' && has(variables.container.env[0].value) && size(variables.container.env[0].value) > 0 && size(variables.container.env[0].value) <= 262144 && variables.container.env[0].value.matches('^[A-Za-z0-9+/]+={0,2}$') && !has(variables.container.env[0].valueFrom) && variables.container.env[1].name == 'PROW_AI_MODEL_PROVIDER_TOKEN' && !has(variables.container.env[1].value) && has(variables.container.env[1].valueFrom) && has(variables.container.env[1].valueFrom.secretKeyRef) && variables.container.env[1].valueFrom.secretKeyRef.name == \"capz-aster-fix-model\" && variables.container.env[1].valueFrom.secretKeyRef.key == \"AI_TOKEN\" && (!has(variables.container.env[1].valueFrom.secretKeyRef.optional) || variables.container.env[1].valueFrom.secretKeyRef.optional == false) && !has(variables.container.env[1].valueFrom.configMapKeyRef) && !has(variables.container.env[1].valueFrom.fieldRef) && !has(variables.container.env[1].valueFrom.resourceFieldRef) && (!has(variables.container.envFrom) || size(variables.container.envFrom) == 0)"
      message: "dashboard Fix Sandbox executor environment must match the configured request and provider credential"
    - expression: "(!has(variables.container.ports) || size(variables.container.ports) == 0) && (!has(variables.container.volumeDevices) || size(variables.container.volumeDevices) == 0) && !has(variables.container.lifecycle) && !has(variables.container.livenessProbe) && !has(variables.container.readinessProbe) && !has(variables.container.startupProbe) && !has(variables.container.restartPolicy) && (!has(variables.container.restartPolicyRules) || size(variables.container.restartPolicyRules) == 0) && (!has(variables.container.resizePolicy) || size(variables.container.resizePolicy) == 0) && (!has(variables.container.stdin) || variables.container.stdin == false) && (!has(variables.container.stdinOnce) || variables.container.stdinOnce == false) && (!has(variables.container.tty) || variables.container.tty == false) && !has(variables.container.workingDir) && !has(variables.container.terminationMessagePath) && !has(variables.container.terminationMessagePolicy)"
      message: "dashboard Fix Sandbox executor process shape is fixed"
    - expression: "size(variables.container.resources.requests) == 3 && size(variables.container.resources.limits) == 3 && (!has(variables.container.resources.claims) || size(variables.container.resources.claims) == 0) && variables.container.resources.requests['cpu'] == \"100m\" && variables.container.resources.requests['memory'] == \"128Mi\" && variables.container.resources.requests['ephemeral-storage'] == \"256Mi\" && variables.container.resources.limits['cpu'] == \"1\" && variables.container.resources.limits['memory'] == \"512Mi\" && variables.container.resources.limits['ephemeral-storage'] == \"256Mi\""
      message: "dashboard Fix Sandbox resources must match configured bounds"
    - expression: "size(variables.container.volumeMounts) == 2 && variables.container.volumeMounts.exists(v, v.name == 'workspace' && v.mountPath == '/workspace' && (!has(v.readOnly) || v.readOnly == false)) && variables.container.volumeMounts.exists(v, v.name == 'tmp' && v.mountPath == '/tmp' && (!has(v.readOnly) || v.readOnly == false))"
      message: "dashboard Fix Sandbox mounts are limited to disposable workspace and tmp"
    - expression: "size(variables.pod.volumes) == 2 && variables.pod.volumes.all(v, has(v.emptyDir) && !has(v.awsElasticBlockStore) && !has(v.azureDisk) && !has(v.azureFile) && !has(v.cephfs) && !has(v.cinder) && !has(v.configMap) && !has(v.csi) && !has(v.downwardAPI) && !has(v.ephemeral) && !has(v.fc) && !has(v.flexVolume) && !has(v.flocker) && !has(v.gcePersistentDisk) && !has(v.gitRepo) && !has(v.glusterfs) && !has(v.hostPath) && !has(v.image) && !has(v.iscsi) && !has(v.nfs) && !has(v.persistentVolumeClaim) && !has(v.photonPersistentDisk) && !has(v.portworxVolume) && !has(v.projected) && !has(v.quobyte) && !has(v.rbd) && !has(v.scaleIO) && !has(v.secret) && !has(v.storageos) && !has(v.vsphereVolume)) && variables.pod.volumes.exists(v, v.name == 'workspace' && v.emptyDir.sizeLimit == \"256Mi\") && variables.pod.volumes.exists(v, v.name == 'tmp' && v.emptyDir.sizeLimit == '64Mi')"
      message: "dashboard Fix Sandbox storage must use only bounded emptyDir volumes"
    - expression: "(!has(variables.pod.imagePullSecrets) || size(variables.pod.imagePullSecrets) == 0) && (!has(variables.pod.nodeSelector) || size(variables.pod.nodeSelector) == 0) && (!has(variables.pod.tolerations) || size(variables.pod.tolerations) == 0) && !has(variables.pod.nodeName) && !has(variables.pod.hostname) && !has(variables.pod.hostnameOverride) && !has(variables.pod.subdomain) && !has(variables.pod.affinity) && !has(variables.pod.schedulerName) && !has(variables.pod.priority) && !has(variables.pod.priorityClassName) && !has(variables.pod.preemptionPolicy) && (!has(variables.pod.topologySpreadConstraints) || size(variables.pod.topologySpreadConstraints) == 0) && (!has(variables.pod.schedulingGates) || size(variables.pod.schedulingGates) == 0) && !has(variables.pod.schedulingGroup) && (!has(variables.pod.readinessGates) || size(variables.pod.readinessGates) == 0) && (!has(variables.pod.resourceClaims) || size(variables.pod.resourceClaims) == 0) && !has(variables.pod.resources) && !has(variables.pod.os) && !has(variables.pod.overhead)"
      message: "dashboard Fix Sandboxes must not override placement, scheduling, devices, registry credentials, or network identity"

