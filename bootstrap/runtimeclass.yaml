apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: aster-kata-vm-isolation
  labels:
    app.kubernetes.io/managed-by: aster
    app.kubernetes.io/part-of: aster-platform
handler: kata
overhead:
  podFixed:
    memory: 600Mi
scheduling:
  nodeSelector:
    kubernetes.azure.com/kata-vm-isolation: "true"
  tolerations:
    - key: kata
      operator: Equal
      value: enabled
      effect: NoSchedule
