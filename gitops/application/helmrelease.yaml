apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capz-aster
  namespace: capz-aster
spec:
  interval: 30m
  releaseName: capz-aster
  targetNamespace: capz-aster
  storageNamespace: capz-aster
  dependsOn:
    - name: capz-aster-platform
  chartRef:
    kind: OCIRepository
    name: capz-aster-application-chart
  timeout: 15m
  driftDetection:
    mode: enabled
  install:
    createNamespace: false
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: ValidatingAdmissionPolicy
              name: capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: ValidatingAdmissionPolicyBinding
              name: capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: Role
              name: capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc
              namespace: capz-aster-sandbox
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: RoleBinding
              name: capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc
              namespace: capz-aster-sandbox
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
  valuesFrom:
    - kind: ConfigMap
      name: capz-aster-application-values
      valuesKey: values.yaml
