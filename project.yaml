id: capz-aster
name: CAPZ Aster
short_name: CAPZ

testgrid:
  dashboard: sig-cluster-lifecycle-cluster-api-provider-azure

discovery:
  source: testgrid

storage:
  provider: gcs
  bucket: kubernetes-ci-logs

branding:
  title: CAPZ Aster Prow Dashboard
  base_path: /
  site_url: "https://capz-aster-99e3d335-c8fva4csbpcuh2e8.b01.azurefd.net"
  source_repo:
    owner: kubernetes-sigs
    name: cluster-api-provider-azure

categories:
  - match: conformance
    id: conformance
    label: Conformance
  - match: "[managed kubernetes]"
    id: aks-e2e
    label: AKS E2E
  - match: e2e-aks
    id: aks-e2e
    label: AKS E2E
  - match: capi-e2e
    id: capi-e2e
    label: CAPI E2E
  - match: upgrade
    id: upgrade
    label: Upgrade
  - match: coverage
    id: coverage
    label: Coverage
  - match: scalability
    id: scalability
    label: Scalability
  - match: e2e
    id: capz-e2e
    label: CAPZ E2E

category_display_order:
  - capz-e2e
  - aks-e2e
  - upgrade
  - capi-e2e
  - conformance
  - coverage
  - scalability
  - other

pull_requests:
  enabled: true

issues:
  enabled: false
  repo:
    owner: kubernetes-sigs
    name: cluster-api-provider-azure
  labels:
    - ai-proposed-fix-demo

ai:
  api: chat_completions
  endpoint: https://api.githubcopilot.com/chat/completions
  model: claude-sonnet-4.6
  cache_generation: capz-aster-v09rc1-sonnet46-20260815
  usage:
    pricing:
      currency: USD
      input_per_million: "3"
      cached_input_per_million: "0.30"
      output_per_million: "15"
  concurrency: 2
  timeout: 45m
  max_iters: 11
  min_tool_calls: 2
  min_gcs_bytes: 5000000
  critique:
    max_retries: 1
    cache_policy: hard
  tools:
    - filesystem
    - k8s
  source_repo:
    owner: kubernetes-sigs
    name: cluster-api-provider-azure
  fix_prs:
    enabled: true
    repo:
      owner: kubernetes-sigs
      name: cluster-api-provider-azure
    fork: true
    author_name: William Yao
    author_email: william2000yao@gmail.com
    max_files: 3
    labels:
      - ai-proposed-fix-demo
    critique_retries: 0
    agent_runtime:
      type: agent-sandbox
      max_turns: 30
      allow_bash: false
      timeout: 10m
      output_limit_bytes: 524288
      allowed_commands:
        - argv: [git, diff, --cached, --check]
          timeout: 1m
      model_provider:
        credential_mode: direct
        api: chat_completions
        endpoint: https://api.githubcopilot.com/chat/completions
        model: claude-sonnet-4.6
        reasoning_effort: high
        auth:
          type: bearer
        public_ca_private_dns: false
  consumer_skills:
    required: true
    minimum_count: 13
