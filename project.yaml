id: capz-aster
name: CAPZ Aster
short_name: CAPZ

discovery:
  testgrid_dashboard: sig-cluster-lifecycle-cluster-api-provider-azure

storage:
  bucket: kubernetes-ci-logs

branding:
  base_path: /
  site_url: "https://capz-aster-99e3d335-c8fva4csbpcuh2e8.b01.azurefd.net"
  source_repo:
    owner: kubernetes-sigs
    name: cluster-api-provider-azure

categories:
  - match: conformance
    id: conformance
    label: Conformance
  - match: "[managed kubernetes]"
    id: aks-e2e
    label: AKS E2E
  - match: e2e-aks
    id: aks-e2e
    label: AKS E2E
  - match: capi-e2e
    id: capi-e2e
    label: CAPI E2E
  - match: upgrade
    id: upgrade
    label: Upgrade
  - match: coverage
    id: coverage
    label: Coverage
  - match: scalability
    id: scalability
    label: Scalability
  - match: e2e
    id: capz-e2e
    label: CAPZ E2E

category_display_order:
  - capz-e2e
  - aks-e2e
  - upgrade
  - capi-e2e
  - conformance
  - coverage
  - scalability
  - other

pull_requests:
  enabled: true

issues:
  enabled: false
  labels:
    - ai-proposed-fix-demo

notifications:
  email:
    enabled: true
    # Pattern-level mail with inert Review issue draft and Review fix proposal
    # links. Safe here because the server runs with actions enabled behind OAuth.
    action_links: true
    from: "CAPZ Aster <prow.ai.dashboard@gmail.com>"
    to:
      - prow.ai.dashboard@gmail.com
    smtp:
      host: smtp.gmail.com
      port: 587
      username: prow.ai.dashboard@gmail.com
      tls: starttls

ai:
  api: responses
  endpoint: https://api.githubcopilot.com/responses
  model: gpt-5.6-sol
  cache_generation: capz-aster-v09rc1-sonnet46-20260815
  usage:
    pricing:
      currency: USD
      input_per_million: "2"
      cached_input_per_million: "0.20"
      cache_write_input_per_million: "2"
      output_per_million: "10"
  concurrency: 2
  timeout: 45m
  max_iters: 11
  min_tool_calls: 2
  min_gcs_bytes: 5000000
  critique:
    max_retries: 1
    cache_policy: hard
  tools:
    - filesystem
    - k8s
  fix_prs:
    enabled: true
    author_name: William Yao
    author_email: william2000yao@gmail.com
    labels:
      - ai-proposed-fix-demo
    critique_retries: 0
    agent_runtime:
      type: agent-sandbox
      max_turns: 30
      allow_bash: false
      timeout: 10m
      output_limit_bytes: 524288
      allowed_commands:
        - argv: [git, diff, --cached, --check]
          timeout: 1m
      model_provider:
        credential_mode: direct
        api: chat_completions
        endpoint: https://api.githubcopilot.com/chat/completions
        model: claude-sonnet-4.6
        reasoning_effort: high
        auth:
          type: bearer
        public_ca_private_dns: false
  consumer_skills:
    required: true
    minimum_count: 13
