name: Aster GitOps check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: azure/setup-kubectl@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build pinned Aster CLI
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}
        run: |
          set -euo pipefail
          go install github.com/willie-yao/aster/backend/cmd/aster@5812153b38f076447165633d41957c5ef3dd7a36

      - name: Verify consumer checksums
        shell: bash
        run: sha256sum -c SHA256SUMS

      - name: Run static doctor
        shell: bash
        run: |
          "$RUNNER_TEMP/aster" onboard doctor -project-dir .

      - name: Check canonical GitOps bundle
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aster" kubernetes gitops check \
            -project-dir . \
            -values deploy/values.yaml \
            -platform-values deploy/platform-values.yaml \
            -gitops-dir gitops \
            -release capz-aster \
            -namespace capz-aster \
            -execution-namespace capz-aster-sandbox \
            -chart oci://ghcr.io/willie-yao/charts/aster \
            -platform-chart oci://ghcr.io/willie-yao/charts/aster-platform \
            -chart-version 0.9.0-rc.13

      - name: Lint and render charts
        shell: bash
        run: |
          set -euo pipefail
          helm pull oci://ghcr.io/willie-yao/charts/aster \
            --version 0.9.0-rc.13 \
            --destination "$RUNNER_TEMP"
          helm pull oci://ghcr.io/willie-yao/charts/aster-platform \
            --version 0.9.0-rc.13 \
            --destination "$RUNNER_TEMP"
          python3 - <<'PY'
          from pathlib import Path

          for source, destination in (
              ("gitops/application/values-configmap.yaml", "application-values.yaml"),
              ("gitops/platform/values-configmap.yaml", "platform-values.yaml"),
          ):
              lines = Path(source).read_text().splitlines()
              start = lines.index("  values.yaml: |") + 1
              Path(destination).write_text("\n".join(line[4:] for line in lines[start:]) + "\n")
          PY
          mv application-values.yaml "$RUNNER_TEMP/application-values.yaml"
          mv platform-values.yaml "$RUNNER_TEMP/platform-values.yaml"
          helm lint "$RUNNER_TEMP/aster-0.9.0-rc.13.tgz" -f "$RUNNER_TEMP/application-values.yaml"
          helm lint "$RUNNER_TEMP/aster-platform-0.9.0-rc.13.tgz" -f "$RUNNER_TEMP/platform-values.yaml"
          helm template capz-aster "$RUNNER_TEMP/aster-0.9.0-rc.13.tgz" \
            --namespace capz-aster \
            -f "$RUNNER_TEMP/application-values.yaml" \
            > "$RUNNER_TEMP/application-render.yaml"
          helm template capz-aster-platform "$RUNNER_TEMP/aster-platform-0.9.0-rc.13.tgz" \
            --namespace capz-aster \
            -f "$RUNNER_TEMP/platform-values.yaml" \
            > "$RUNNER_TEMP/platform-render.yaml"
          helm template capz-aster-platform "$RUNNER_TEMP/aster-platform-0.9.0-rc.13.tgz" \
            --namespace capz-aster \
            -f deploy/platform-values.yaml \
            > "$RUNNER_TEMP/platform-source-render.yaml"
          cmp "$RUNNER_TEMP/platform-render.yaml" "$RUNNER_TEMP/platform-source-render.yaml"

      - name: Enforce deployment contract
        shell: bash
        run: |
          set -euo pipefail
          application="$RUNNER_TEMP/application-render.yaml"
          platform="$RUNNER_TEMP/platform-render.yaml"

          if grep -RIE --include='*.yaml' -- '^kind:[[:space:]]*Secret[[:space:]]*$' gitops/; then exit 1; fi
          if grep -Eq '^kind:[[:space:]]*Secret[[:space:]]*$' "$application" "$platform"; then exit 1; fi
          if grep -Eq 'image:[[:space:]]*[^[:space:]]+:(latest|main)([[:space:]]|$)' "$application" "$platform"; then exit 1; fi
          if grep -RIE --exclude-dir=.git -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' .; then exit 1; fi
          if grep -RIE --exclude-dir=.git -- '(^|[^A-Za-z0-9_])(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' .; then exit 1; fi
          mac_root="/""Users/"
          linux_root="/""home/"
          if grep -RIE --exclude-dir=.git --exclude=aster-gitops-check.yml -- "${mac_root}|${linux_root}[^/[:space:]]+/" .; then exit 1; fi

          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path("bootstrap/kustomization.yaml").read_text()
          access = Path("bootstrap/platform-execution-access.yaml").read_text()
          admission_access = Path("bootstrap/fix-admission-access.yaml").read_text()
          assert "fix-admission.yaml" not in bootstrap
          assert "fix-rbac.yaml" not in bootstrap
          assert not Path("bootstrap/fix-admission.yaml").exists()
          assert not Path("bootstrap/fix-rbac.yaml").exists()
          assert "kind: ValidatingAdmissionPolicy\n" not in admission_access
          assert "kind: ValidatingAdmissionPolicyBinding\n" not in admission_access
          assert "resources:\n      - validatingadmissionpolicies\n      - validatingadmissionpolicybindings" in admission_access
          assert "resourceNames:\n      - capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc" in admission_access
          assert "verbs:\n      - get\n      - update\n      - patch" in admission_access
          assert "resources:\n      - roles\n      - rolebindings" in access
          assert "resourceNames:\n      - capz-aster-prow-ai-dashboard-agent-sandbox-a33874cc\n    verbs:\n      - escalate\n      - bind" in access
          PY

          test "$(grep -Ec '^kind:[[:space:]]*PersistentVolumeClaim[[:space:]]*$' "$application")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*Service[[:space:]]*$' "$application")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*Deployment[[:space:]]*$' "$application")" -eq 2
          test "$(grep -Fc 'image: ghcr.io/willie-yao/aster/remote-fixer:sha-8655441' "$application")" -eq 1
          grep -Fq 'service.beta.kubernetes.io/azure-allowed-service-tags: AzureFrontDoor.Backend' "$application"
          grep -Fq 'type: LoadBalancer' "$application"
          grep -Fq 'value: "capz-aster-sandbox"' "$application"
          grep -Fq 'value: "ghcr.io/willie-yao/aster/agent-sandbox-fix-executor@sha256:458ba75465030106920d85813727489e780ac091659b5733a9f1eac774a849dc"' "$application"
          grep -Fq 'value: "direct"' "$application"
          grep -Fq 'value: "bearer"' "$application"
          grep -Fq 'value: "capz-aster-fix-model"' "$application"
          grep -Fq 'value: "high"' "$application"
          test "$(grep -Ec '^kind:[[:space:]]*ValidatingAdmissionPolicy[[:space:]]*$' "$application")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*ValidatingAdmissionPolicyBinding[[:space:]]*$' "$application")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*Role[[:space:]]*$' "$application")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*RoleBinding[[:space:]]*$' "$application")" -eq 1

          python3 - "$application" <<'PY'
          from pathlib import Path
          import re
          import sys

          documents = [part.strip() + "\n" for part in Path(sys.argv[1]).read_text().split("\n---\n") if part.strip()]
          deployments = [part for part in documents if "kind: Deployment\n" in part]
          server = next(part for part in deployments if "name: capz-aster-prow-ai-dashboard-server" in part)
          worker = next(part for part in deployments if "name: capz-aster-prow-ai-dashboard-worker" in part)
          assert server.count("- name: BOT_TOKEN") == 1
          assert "key: BOT_TOKEN" in server and "name: capz-aster-auth" in server
          assert "BOT_TOKEN" not in worker
          # Fix generation is server-only, so only the server carries the git-capable
          # fixer image and the Fix model credential.
          assert "image: ghcr.io/willie-yao/aster/remote-fixer:sha-8655441" in server
          assert "image: ghcr.io/willie-yao/aster:sha-8655441" in worker
          assert "remote-fixer" not in worker
          assert "capz-aster-fix-model" in server
          assert "capz-aster-fix-model" not in worker
          assert "secretKeyRef:\n                  name: capz-aster-fix-model" not in server
          assert "CAUSAL_REMEDIATION" not in server
          assert "CAUSAL_REMEDIATION" not in worker
          # The exact feature gates this deployment turns on, in rendered output.
          # A chart default flipping to true, or a new gate the chart renders,
          # changes this set and fails here rather than switching a feature on
          # unnoticed. A gate the engine reads without the chart rendering an env
          # var is not visible to this check. Dropping set() also rejects a
          # duplicated gate, whose effective value would depend on ordering.
          # Enabling a feature means adding its gate here in the same change.
          def gates(rendered):
              return sorted(re.findall(r"""- name: ["']?([A-Z][A-Z0-9_]*_ENABLED)["']?\b""", rendered))

          assert gates(server) == [
              "ACTIONS_ENABLED",
              "ANALYSIS_CHAT_ENABLED",
              "HSTS_ENABLED",
              "PULL_REQUEST_ESCALATION_ENABLED",
          ], gates(server)
          assert gates(worker) == [], gates(worker)
          assert server.count("- name: ANALYSIS_CHAT_TIMEOUT") == 1
          assert re.search(r'- name: ANALYSIS_CHAT_TIMEOUT\n\s+value: "10m"', server)
          PY

          test "$(grep -Ec '^kind:[[:space:]]*Namespace[[:space:]]*$' "$platform")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*ResourceQuota[[:space:]]*$' "$platform")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*LimitRange[[:space:]]*$' "$platform")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*ServiceAccount[[:space:]]*$' "$platform")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*NetworkPolicy[[:space:]]*$' "$platform")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]*CiliumNetworkPolicy[[:space:]]*$' "$platform")" -eq 1
          grep -Fq 'automountServiceAccountToken: false' "$platform"
          grep '^[[:space:]]*- matchName:' "$platform" | sed -E 's/.*"([^"]+)".*/\1/' | sort > "$RUNNER_TEMP/platform-hosts.txt"
          printf '%s\n' api.githubcopilot.com github.com proxy.golang.org storage.googleapis.com sum.golang.org > "$RUNNER_TEMP/expected-platform-hosts.txt"
          cmp "$RUNNER_TEMP/expected-platform-hosts.txt" "$RUNNER_TEMP/platform-hosts.txt"

          # Non-gate leftovers the feature-gate check above cannot see: ORKA_ is a
          # prefix rather than an _ENABLED gate, and the component labels are not
          # environment variables at all.
          if grep -Eq 'ORKA_|app.kubernetes.io/component:[[:space:]]*(orka|model-gateway)' "$application" "$platform"; then exit 1; fi
          grep -Fq 'name: capz-aster-platform' gitops/platform/helmrelease.yaml
          grep -Fq 'dependsOn:' gitops/application/helmrelease.yaml
          grep -Fq 'name: capz-aster-platform' gitops/application/helmrelease.yaml
